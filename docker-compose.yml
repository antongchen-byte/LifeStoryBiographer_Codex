name: lifestory-biographer
x-backend: &backend
  image: lifestory-biographer-api:local
  build: ./apps/api
  env_file: .env
  restart: unless-stopped
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: biographer
      POSTGRES_PASSWORD: biographer
      POSTGRES_DB: biographer
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biographer"]
      interval: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped
  minio:
    image: lifestory-biographer-minio:local
    build: ./infrastructure/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
  temporal-data-init:
    image: temporalio/temporal@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /data"]
    volumes: ["temporal_data:/data"]
    restart: "no"
  temporal:
    image: temporalio/temporal@sha256:cea463d98a8d6def4420f903ea5c3fcd0d85c8d10fbcc2770a50c12fff2eb26d
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db --ui-ip 0.0.0.0
    depends_on:
      temporal-data-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8233:8233"]
    volumes: ["temporal_data:/data"]
    restart: unless-stopped
  storage-init:
    <<: *backend
    command: python -m app.bootstrap_storage
    depends_on: [minio]
    restart: "no"
  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.bootstrap_interviews"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
  worker:
    <<: *backend
    command: python -m app.worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      temporal: { condition: service_started }
  web:
    image: lifestory-biographer-web:local
    build: ./apps/web
    ports: ["127.0.0.1:3000:3000"]
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  clamav:
    image: clamav/clamav:stable
    profiles: ["scan"]
    volumes: ["clamav_data:/var/lib/clamav"]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  minio_data:
  temporal_data:
  clamav_data:
